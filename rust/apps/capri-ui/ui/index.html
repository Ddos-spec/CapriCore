<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capri-RS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="capri-root">
    <div id="stage-wrap">
      <div id="sprite-box" title="Drag untuk pindah | Elus kepala Capri">
        <div id="sprite-hit" class="hit-region"></div>
        <img id="sprite-glitch-r" class="sprite-layer glitch-layer" alt="" draggable="false" />
        <img id="sprite-glitch-c" class="sprite-layer glitch-layer" alt="" draggable="false" />
        <img id="sprite-main" class="sprite-layer" alt="Capri" draggable="false" />
        <div id="headpat-zone" title="Elus kepala Capri"></div>
        <div id="sparkle-layer"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
