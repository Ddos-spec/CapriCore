<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capri</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div id="capri-actor" title="Drag Capri | Elus kepala | Ctrl+Shift+C untuk panggil">
    <div id="capri-hit" class="hit-region"></div>
    <img id="capri-source" alt="" aria-hidden="true" crossorigin="anonymous" />
    <canvas id="capri-gl" width="640" height="640"></canvas>
    <canvas id="capri-overlay" width="1254" height="1254"></canvas>
    <div id="headpat-zone" title="Elus kepala Capri"></div>
    <div id="heart-layer" aria-hidden="true"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
