[package]
name = "capri-voice"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
capri-core = { path = "../capri-core" }
flacenc = "0.5"
hound = "3.5"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
