[package]
name = "capri-gemini"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
capri-core = { path = "../capri-core" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "form", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
